[project]
name = "unblock"
version = "0.2.0"
description = "A repository health CLI for developer workflow and auth-lifecycle signals"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer",
    "pyyaml",
    "gitpython",
    "pyfiglet",
    "PyGithub",
    "rich",
]

[project.scripts]
unblock = "unblock.cli:app"

[project.optional-dependencies]
llm = ["litellm"]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["unblock*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
